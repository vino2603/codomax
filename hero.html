<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Section</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#00c6ff,#0072ff,#ff00cc);
            min-height:100vh;
        }

        nav{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 70px;
            background:rgba(0,0,0,0.2);
        }

        nav h2{
            color:white;
        }

        nav ul{
            display:flex;
            list-style:none;
        }

        nav ul li{
            margin-left:30px;
        }

        nav ul li a{
            text-decoration:none;
            color:white;
            font-weight:bold;
        }

        nav ul li a:hover{
            color:yellow;
        }

        .hero{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:80px;
            color:white;
        }

        .hero-text{
            width:50%;
        }

        .hero-text h3{
            font-size:32px;
        }

        .hero-text h1{
            font-size:60px;
            margin:15px 0;
        }

        .hero-text span{
            color:yellow;
        }

        .hero-text p{
            font-size:20px;
            line-height:35px;
            margin-bottom:30px;
        }

        .btn{
            display:inline-block;
            padding:14px 35px;
            background:white;
            color:#0072ff;
            border-radius:30px;
            text-decoration:none;
            font-weight:bold;
            transition:.3s;
        }

        .btn:hover{
            background:yellow;
            color:black;
        }

        .hero-img img{
            width:350px;
            border-radius:50%;
            border:8px solid white;
            box-shadow:0 0 25px rgba(255,255,255,0.5);
        }

        footer{
            text-align:center;
            color:white;
            padding:20px;
            background:rgba(0,0,0,0.2);
            margin-top:40px;
        }
    </style>

</head>
<body>

    <nav>
        <h2>💻 My Portfolio</h2>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="hero.html">Hero</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
    </nav>

    <section class="hero">

        <div class="hero-text">

            <h3>Hello, I'm</h3>

            <h1>Vinodhini <span>B</span></h1>

            <p>
                M.Sc Computer Science Student<br>
                Aspiring Web Developer<br>
                Passionate about HTML, CSS, JavaScript and Python.
            </p>

            <a href="Vinodhini_Professional_Resume.pdf" class="btn" download>
                📄 Download Resume
            </a>

        </div>

        <div class="hero-img">
            <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile">
        </div>

    </section>

    <footer>
        © 2026 Vinodhini | Codomax Internship
    </footer>
